# Experiment intent ledger. APPEND-ONLY: never delete or reorder
# entries; status is COMPUTED by status.py, not stored here. The one
# mutable field is `recorded` (has this done run's number been written
# into docs/exp-comparison.md yet?). See status.py and the vault guide
# research-coding-practices-guides/tracking-experiment-status.
#
# Per entry:
#   launcher     informational: which generate_*.py runs this
#   config_root  Hydra root config name (used by status.py to compose)
#   overrides    dict of Hydra overrides vs the root config's defaults
#   trials       expected num_trials (status.py counts .done against it)
#   feeds        comparison-table cell(s) this run populates (loose keys)
#   group        algorithm family (cheap filter axis)
#   priority     1 = launch now, 2 = later
#   recorded     true once its number is in docs/exp-comparison.md
#
# Existing on-disk runs are seeded via `python status.py --backfill`,
# not hand-written. Below are a few entries to exercise status.py.

