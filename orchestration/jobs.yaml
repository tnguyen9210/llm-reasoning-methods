# orchestration/jobs.yaml — SLURM allocations the orchestrator
# may use. Design: docs/decisions/hpc-idle-gpu-orchestration.md
#
# AUTO-MAINTAINED: the `jobs:` list is rewritten at every
# 15-minute cycle from `squeue -u tnguyen9210` (running-state GPU
# jobs) — expired/pending/vanished entries pruned, new
# allocations added. Manual edits to `jobs:` will be overwritten.
#
# `exclude:` is the one manual control and IS preserved across
# refreshes: add a job id here to keep that session off-limits
# (e.g. a notebook you are about to use interactively, whose GPU
# would otherwise look idle and get claimed).

exclude: []

