# orchestration/queue.yaml — experiments the orchestrator may
# launch. Design: docs/decisions/hpc-idle-gpu-orchestration.md
#
# YOU (Tuan):
#   - append entries with `status: planned` (drained top-first;
#     reorder to reprioritize)
#   - delete an entry once you have verified its runs completed
#     (the orchestrator never marks anything done)
# ORCHESTRATOR:
#   - flips `status: planned` -> `running` and fills `launch:`
#     at launch time; touches nothing else in this file
#
# Fields: id (unique handle), command (full launch command, run
# from the repo root), expected_hr (optional — walltime guard
# skips allocations with less remaining time), status, launch.


# level-5 cnt-mcts model-family grid (qwen PRM), remaining 4 of 5
# rows — see docs/exp-comparison-level5.md "model family, size,
# quantization comparison (qwen PRM)". llama-1b is the running
# entry above.
# relaunch: 2026-07-11 05:22 attempt (job 22823450) died before
# wandb.init — no run to verify; reset to planned 2026-07-12.
- id: cnt-mcts-l5-qwen7b-gptq
  command: >
    python generate_mcts_cnt.py --config-name mcts_cnt_prm800k
    llm=qwen_7b_gptq_int4 prm=qwen_prm data.level=5
  expected_hr: 8
  status: planned


# level-5 sem-mcts (mcts_sem_v02) lam/ds_alpha joint sweep,
# llama-1b, qwen PRM — the 12 w_eff∈{1,3,10,100} × lam∈{1.0,0.1,
# 0.01} cells of docs/exp-comparison-level5.md "lam / ds_alpha
# joint sweep (v02, llama-1b)". ds_alpha = w_eff*sqrt(lam).
# relaunch: 2026-07-11 05:22 attempt (job 22823452) died before
# wandb.init — no run to verify; reset to planned 2026-07-12.
- id: sem-mcts-l5-llama1b-lam1.0-weff1
  command: >
    python generate_mcts_sem.py --config-name mcts_sem_v02_prm800k
    llm=llama_1b prm=qwen_prm search.lam=1.0 search.ds_alpha=1
    data.level=5
  expected_hr: 9
  status: planned


# level-5 sem-mcts (mcts_sem_v02) lam/ds_alpha joint sweep,
# llama-3b, qwen PRM — same 12-cell w_eff∈{1,3,10,100} ×
# lam∈{1.0,0.1,0.01} grid as the llama-1b block above.
# ⚠ llama-3b + level-5 carries elevated context-overflow risk on
# every cell until the length guard lands (docs/decisions/
# context-length-overflow-guard.md): llama-3b is the model whose
# bl_sem cells crashed at max_model_len=5000, and level-5
# completions run longer. sem_v02 (phase-based) is the milder
# protocol, but a crash mid-trial surfaces only at manual
# verification (no monitoring, by design).
