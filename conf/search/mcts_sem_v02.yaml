# @package search
# Search-method group → binds onto MCTSSemV02Config (PRM embeds).
# The mcts_sem_v02_schema node (registered in the launcher under group
# "search") supplies the typed dataclass; values below override it.
# Each method carries only its own hyperparameters. Same knobs as v01
# except the embedding SOURCE: here it's the PRM, so there's no second
# pooling engine and no embeds_gpu_memory_utilization.
defaults:
  - mcts_sem_v02_schema
  - _self_

method: mcts_sem_v02
embeds_source: prm      # PRM last-layer hidden states (no 2nd engine)
batch_size: 4           # candidates generated per expansion
lookahead: 0
max_depth: 20
negative_reward: 0
num_phases: 1000
gen_budget: 80          # total generations across the full run

# diversity selection: q_val = ds_beta*score + ds_alpha*diversity
lam: 0.01               # ridge: V_0 = lam * I
ds_alpha: 100.0         # diversity weight
ds_beta: 1.0            # q-value weight
tie_tol: 1.0e-4         # selection tie band (both paths): 1e-4 =
                        #   the historical hardcoded band; 0.0 =
                        #   exact-equality ties (cnt-mcts-aligned)

# embedding extraction. Pipeline: pool -> project -> center -> normalize.
embeds_strategy: last   # "last" | "avg"
embeds_scope: full      # "full" | "response" ("response" unsupported
                        #   for embeds_source=prm — see search core)
embeds_normalize: true
embeds_center: false
embeds_center_mode: fixed  # "fixed" | "local" (which mean, when
                        #   center=true): "fixed" = held-out .npy from
                        #   embeds_mean_dir; "local" = each expansion's
                        #   own sibling-group mean, fresh every
                        #   expansion (rep_exp-style — docs/decisions/
                        #   rep-exp-elliptical-bonus-review.md)
embeds_mean_dir: ""     # results/-relative .npy prefix (if center=true
                        #   and mode=fixed); the mean must be computed
                        #   POST-projection when proj is on
# Post-projection dim = size of the covariance V. The raw PRM hidden
# size (Llama3.1-8B-PRM = 4096) is read off the pooled tensor, then
# sparse-projected down to this. (Set 4096 + embeds_proj=none to feed
# the raw PRM embeds straight in, as before.)
embeds_dim: 512
embeds_proj: sparse     # "none" | "sparse" (JL random projection;
                        #   matrix seed is fixed internally, not a knob)
prm_embeds_layer: -1    # which PRM layer to pool (-1 = last)

# covariance bookkeeping + expansion policy
# Default is sm (Sherman-Morrison): O(d^2)/selection persistent inverse
# update vs exact's O(d^3) re-inversion, validated machine-precision-
# identical to exact (0 selection mismatches). Set "exact" for a
# numerical reference / cross-check (the dataclass default stays exact
# for v01, whose sm path isn't refactored).
cov_update: sm   # "exact" | "sm" (Sherman-Morrison)
cov_dtype: fp64  # "fp32" | "fp64" (precision of V/V_inv and the
                 #   embeds multiplied against them; fp64 matches the
                 #   prior implicit NumPy-default behavior — see
                 #   docs/decisions/covariance-precision.md)
revisit_policy: reuse   # "reuse" | "regenerate"

# Where the covariance lives. "global" = one V for the whole tree
# (the long-standing behavior); "local" = one V per node, over the
# children that node selected, so sibling subtrees never see each
# other's folds. "local" allocates one d x d matrix per
# selected-through node, bounded by gen_budget -- MCTS.__init__
# refuses combinations over 4 GiB/question.
cov_scope: global       # "global" | "local"

# What vector represents a child in its parent's selection problem.
# "absolute" = the child's own pooled embedding; "relative" = the
# displacement (child - parent), which strips the long shared text
# prefix siblings have in common and scores step DIRECTIONS instead
# of absolute positions. Falls back to absolute at the root (no
# parent embedding). Cannot be combined with
# embeds_center_mode=local -- that double-centers.
embeds_ref: absolute    # "absolute" | "relative" (parent-relative)

# NOTE: no embeds_gpu_memory_utilization here — v02 has no pooling
# engine (embeds come from the PRM). The schema default is inherited
# but unused; the generative engine's share is set on the llm group
# in the top-level YAML.

# PRM micro-batch for in-loop candidate scoring
prm_batch_size: 1
