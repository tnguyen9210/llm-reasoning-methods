# @package search
# Search-method group → binds onto MCTSSemV02LocalConfig (PRM embeds,
# per-node covariance). The mcts_sem_v02_01_schema node (registered in
# the launcher under group "search") supplies the typed dataclass;
# values below override it.
#
# Every value here is copied from conf/search/mcts_sem_v02.yaml so the
# two methods differ in exactly one knob — cov_scope — and an A/B is a
# clean read of covariance locality alone. Keep them in sync when
# either is retuned.
defaults:
  - mcts_sem_v02_01_schema
  - _self_

method: mcts_sem_v02_01
embeds_source: prm      # PRM last-layer hidden states (no 2nd engine)
batch_size: 4           # candidates generated per expansion
lookahead: 0
max_depth: 20
negative_reward: 0
num_phases: 1000
gen_budget: 80          # total generations across the full run

# diversity selection: q_val = ds_beta*score + ds_alpha*diversity
lam: 0.01               # ridge: V_0 = lam * I (per node under local)
ds_alpha: 100.0         # diversity weight
ds_beta: 1.0            # q-value weight

# embedding extraction. Pipeline: pool -> project -> center -> normalize.
embeds_strategy: last   # "last" | "avg"
embeds_scope: full      # "full" | "response" ("response" unsupported
                        #   for embeds_source=prm — see search core)
embeds_normalize: true
embeds_center: false
embeds_center_mode: fixed  # "fixed" | "local". NOTE: "local" here plus
                        #   cov_scope=local below is the rep_exp
                        #   pairing (group-centered features folded
                        #   into that group's own covariance) — the
                        #   combination v02 could not express. See
                        #   docs/decisions/embeds-centering-design.md.
embeds_mean_dir: ""     # results/-relative .npy prefix (if center=true
                        #   and mode=fixed); the mean must be computed
                        #   POST-projection when proj is on
# Post-projection dim = size of EVERY node's covariance under
# cov_scope=local, so it is also the per-node memory multiplier:
# d^2 * itemsize bytes per selected-through node (512^2 * 8 = 2 MiB at
# fp64). Bounded by gen_budget nodes per question.
embeds_dim: 512
embeds_proj: sparse     # "none" | "sparse" (JL random projection;
                        #   matrix seed is fixed internally, not a knob)
prm_embeds_layer: -1    # which PRM layer to pool (-1 = last)

# covariance bookkeeping + expansion policy
cov_scope: local        # "local" (per node) | "global" (v02 behavior;
                        #   the verification lever — see the core
                        #   module docstring)
cov_update: sm   # "exact" | "sm" (Sherman-Morrison). Applies per node
                 #   under cov_scope=local. "sm" is O(d^2)/selection
                 #   against exact's O(d^3), and halves memory: it
                 #   keeps only V_inv, while "exact" holds V too.
cov_dtype: fp64  # "fp32" | "fp64" (precision of V/V_inv and the
                 #   embeds multiplied against them; fp32 halves the
                 #   per-node covariance memory — see docs/decisions/
                 #   covariance-precision.md)
revisit_policy: reuse   # "reuse" | "regenerate"

# PRM micro-batch for in-loop candidate scoring
prm_batch_size: 1
