# @package search
# Search-method group → binds onto BLMCTSKubeV02Config.
# v02 of BLMCTSKubeV01Config's family -- delayed-eager terminal
# backprop + path-aware KUBE density (both schedules; only the
# bonus's clock is schedule-specific).
# See docs/decisions/bl-cnt-v02-eager-backprop-path-aware.md.
# The mcts_bl_kube_v02_schema node (registered in the launcher under
# group "search") supplies the typed dataclass; values below
# override it. Each method carries only its own hyperparameters.
defaults:
  - mcts_bl_kube_v02_schema
  - _self_

method: mcts_bl_kube_v02
batch_size: 4           # candidates generated per expansion
lookahead: 0
max_depth: 20
negative_reward: 0
num_phases: 1000
gen_budget: 80           # total generations across the full run
kube_c: 2.0
kube_schedule: parent    # "parent" (UCT-style) | "global" (KUBE clock)
kube_affordable: true    # KUBE feasibility step: argmax over nodes
                         # whose cost fits the remaining gen budget
score_mode: parent_blend # "parent_blend" | "path_decay" (sweep arms;
                         # kube_c is NOT comparable across modes)
alpha: 0.8               # parent_blend only: own-q vs. parent-q
                         # blend; 1.0 = plain KUBE (no-blend control
                         # arm -- include it in any sweep)
gamma: 0.8               # path_decay only: per-hop decay (1.0 =
                         # plain path average; 0.0 = own q + AZ
                         # bonus, NOT a v01 control arm)
