# paths
base_dir: /groups/chichengz/tnn/datasets
ds_dir: ${base_dir}/prm800k/math_splits
llm_dir: ${base_dir}/Llama3.2-1B-Instruct
prm_dir: ${base_dir}/Llama3.1-8B-PRM-Deepseek-Data

# dataset
ds_name: prm800k
ds_split: test
question_field: problem
level: 4

# experiment
algo: mcts_embeds
num_trials: 4
num_questions: -1  # -1 = use full dataset

# search params
n: 4                    # candidates generated per expansion
lookahead: 0
max_depths: 20
agg_strategy: last
temperature: 0.8
max_tokens: 2048
top_p: 1.0
seed: 0
date_string: "Aug 1 2025"

# mcts params
num_phases: 1000
num_batches: 4          # step_budget = num_batches * max_depths
negative_reward: 0

# embeds params
lam: 0.01
ds_alpha: 100.0
ds_beta: 1.0
embeds_strategy: last
embeds_normalizing: true
embeds_centering: false
embeds_mean_dir: "embeds_mean_bon--level-4--v01_0_0--bs-256"

# vllm (generate)
tensor_parallel_size: 1
swap_space: 16
max_model_len: 5000
gpu_memory_utilization: 0.2
dtype: float16

# vllm (embeds)
embeds_gpu_memory_utilization: 0.30
